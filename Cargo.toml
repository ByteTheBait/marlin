[package]
name = "marlin"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"     # Optimize aggressively for size (or "s" for a speed/size balance)
strip = true        # Automatically remove all debug symbols and annotations
lto = true          # Enable Link-Time Optimization across all dependency crates
codegen-units = 1   # Reduce parallel compilation blocks to maximize size optimizations
panic = "abort"   
 
[dependencies]
ratatui          = ">=0.30"
crossterm        = "0.28"
tui-textarea     = { version = "0.7", features = ["crossterm"] }
tokio            = { version = "1", features = ["full"] }
reqwest          = { version = "0.12", features = ["stream", "json"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
futures          = "0.3"
async-trait      = "0.1"
dirs             = "5"
unicode-width    = "0.2"
chrono           = { version = "0.4", features = ["serde"] }
uuid             = { version = "1", features = ["v4"] }
anyhow           = "1"
tachyonfx = "0.25.0"
sha2       = "0.10"
